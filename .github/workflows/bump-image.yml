name: bump-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Nouveau tag d'image (ex: david-2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: recuperer le code
        uses: actions/checkout@v7

      - name: verifier le format du tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! echo "$TAG" | grep -Eq '^[a-z0-9][a-z0-9.-]*$'; then
            echo "ERREUR : tag invalide ($TAG) - attendu <prenom>-<version>, minuscules."
            exit 1
          fi
          echo "Tag accepte : $TAG"

      - name: remplacer le tag dans k8s/deployment-inventory.yaml
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sed -i -E "s|(image: .+/semishop:).+|\1${TAG}|" k8s/deployment-inventory.yaml
          grep -n "image:" k8s/deployment-inventory.yaml

      - name: committer et pousser (github-actions bot)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment-inventory.yaml
          if git diff --cached --quiet; then
            echo "Le tag demande est deja en place : rien a committer."
            exit 0
          fi
          git commit -m "ci: bump image inventory -> ${TAG}"
          git push
