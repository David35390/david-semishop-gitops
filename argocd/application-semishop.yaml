apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: semishop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/David35390/david-semishop-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: semishop
  syncPolicy:
    automated:
      selfHeal: true
